<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADMIN • FARMA LIMA</title>
  <style>
    :root{
      --bg:#050608; --text:#EAF2F2; --muted:rgba(234,242,242,.65);
      --card:rgba(255,255,255,.04); --border:rgba(255,255,255,.12);
      --teal:#34CCD1; --red:#EC1F26;
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    .wrap{max-width:1000px;margin:0 auto;padding:20px 14px 70px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    h1{margin:0;font-size:16px;letter-spacing:1px}
    .hint{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.4}
    .card{border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:var(--card);margin-top:12px}
    label{display:block;margin-top:10px;font-size:12px;color:rgba(234,242,242,.7)}
    input, textarea{
      width:100%;margin-top:6px;padding:11px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);color:var(--text);outline:none;
    }
    textarea{min-height:90px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:820px){.row{grid-template-columns:1fr}}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    button,a.btn{
      border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);
      color:var(--text);padding:10px 14px;border-radius:999px;font-weight:900;cursor:pointer;
      text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
    }
    button.primary{border-color:rgba(52,204,209,.45);background:rgba(52,204,209,.12)}
    button.danger{border-color:rgba(236,31,38,.45);background:rgba(236,31,38,.10)}
    .unit{border:1px dashed rgba(255,255,255,.18);border-radius:14px;padding:12px;margin-top:10px}
    .status{margin-top:10px;font-size:12px;color:var(--muted)}
    .status.ok{color:#b8ffd8}
    .status.err{color:#ffb8b8}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>ADMIN • FARMA LIMA (SEM LOGIN)</h1>
      <div class="btns" style="margin:0">
        <a class="btn" href="/" target="_blank" rel="noopener">VER SITE</a>
        <button class="primary" id="save">SALVAR</button>
        <button id="reload">RECARREGAR</button>
      </div>
    </div>

    <div class="hint">
      ⚠️ ESTE ADMIN ESTÁ ABERTO (SEM SENHA). USE SÓ PRA AJUSTAR AGORA E DEPOIS A GENTE BLOQUEIA DE NOVO.
    </div>

    <div class="card">
      <h2 style="margin:0;font-size:14px">MARCA</h2>
      <label>NOME</label><input id="brandName" />
      <label>SLOGAN</label><input id="brandTagline" />
      <label>LOGO (URL/CAMINHO) EX: /assets/logo-farmalima.png</label><input id="brandLogoUrl" />
    </div>

    <div class="card">
      <h2 style="margin:0;font-size:14px">TEMA (CORES)</h2>
      <div class="row">
        <div><label>FUNDO</label><input id="cBg" placeholder="#050608"></div>
        <div><label>TEXTO</label><input id="cText" placeholder="#EAF2F2"></div>
      </div>
      <div class="row">
        <div><label>VERMELHO</label><input id="cRed" placeholder="#EC1F26"></div>
        <div><label>CIANO</label><input id="cTeal" placeholder="#34CCD1"></div>
      </div>
    </div>

    <div class="card">
      <h2 style="margin:0;font-size:14px">WHATSAPP PRINCIPAL</h2>
      <label>NÚMERO (55 + DDD + NÚMERO)</label><input id="mainWaNumber" placeholder="5592..." />
      <label>MENSAGEM PADRÃO</label><input id="mainWaMsg" />
      <label>TEXTO DO BOTÃO</label><input id="mainWaLabel" placeholder="FALAR NO WHATSAPP" />
    </div>

    <div class="card">
      <h2 style="margin:0;font-size:14px">HERO</h2>
      <label>TÍTULO</label><input id="heroTitle" />
      <label>TEXTO</label><textarea id="heroText"></textarea>
    </div>

    <div class="card">
      <h2 style="margin:0;font-size:14px">UNIDADES</h2>
      <div class="hint">ADICIONE QUANTAS QUISER. WHATSAPP = 55+DDD+NÚMERO.</div>
      <div id="units"></div>

      <div class="btns">
        <button id="addUnit">+ ADICIONAR UNIDADE</button>
      </div>
    </div>

    <div class="card">
      <div class="status" id="status">PRONTO.</div>
    </div>
  </div>

  <script>
    const DEFAULT = {
      theme:{ bg:"#050608", text:"#EAF2F2", red:"#EC1F26", teal:"#34CCD1" },
      brand:{ name:"FARMA LIMA", tagline:"ENDEREÇOS • CONTATOS • WHATSAPP", logoUrl:"/assets/logo-farmalima.png" },
      hero:{ title:"BEM-VINDO À FARMA LIMA", text:"ATENDIMENTO RÁPIDO, PRESENÇA LOCAL E CONFIANÇA." },
      mainWhatsapp:{ number:"5592999999999", message:"OLÁ! QUERO INFORMAÇÕES DA FARMA LIMA.", label:"FALAR NO WHATSAPP" },
      units:[]
    };

    const el = (id)=>document.getElementById(id);
    const status = el("status");
    const unitsWrap = el("units");

    function setStatus(msg, type){
      status.textContent = msg;
      status.className = "status " + (type || "");
    }

    function unitTemplate(u, idx){
      return `
        <div class="unit" data-idx="${idx}">
          <div class="row">
            <div>
              <label>NOME</label>
              <input data-k="name" value="${u.name||""}">
            </div>
            <div>
              <label>TIPO</label>
              <input data-k="type" value="${u.type||"UNIDADE"}">
            </div>
          </div>

          <div class="row">
            <div>
              <label>BADGE (EX: red OU VAZIO)</label>
              <input data-k="badge" value="${u.badge||"red"}">
            </div>
            <div>
              <label>DESCRIÇÃO</label>
              <input data-k="description" value="${u.description||""}">
            </div>
          </div>

          <label>ENDEREÇO</label>
          <input data-k="address" value="${u.address||""}">

          <label>LINK MAPS (OPCIONAL)</label>
          <input data-k="maps" value="${u.maps||""}">

          <div class="row">
            <div>
              <label>WHATSAPP</label>
              <input data-k="whatsapp" value="${u.whatsapp||""}">
            </div>
            <div>
              <label>MENSAGEM WHATSAPP</label>
              <input data-k="wmsg" value="${u.wmsg||"OLÁ! QUERO INFORMAÇÕES."}">
            </div>
          </div>

          <div class="btns">
            <button class="danger" type="button" data-remove="${idx}">REMOVER</button>
          </div>
        </div>
      `;
    }

    function renderUnits(units){
      unitsWrap.innerHTML = (units || []).map((u,i)=>unitTemplate(u,i)).join("");
      // bind remove
      [...document.querySelectorAll("button[data-remove]")].forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const idx = Number(btn.dataset.remove);
          window.__data.units.splice(idx, 1);
          renderUnits(window.__data.units);
        });
      });
    }

    function readUnitsFromDOM(){
      const boxes = [...document.querySelectorAll(".unit")];
      return boxes.map(box=>{
        const obj = {};
        [...box.querySelectorAll("input[data-k]")].forEach(inp=>{
          obj[inp.dataset.k] = inp.value.trim();
        });
        return obj;
      });
    }

    async function load(){
      setStatus("CARREGANDO…");
      let data = DEFAULT;
      try{
        const r = await fetch("/api/content", { cache:"no-store" });
        if (r.ok) {
          const apiData = await r.json();
          // merge simples
          data = { ...DEFAULT, ...apiData };
          data.theme = { ...DEFAULT.theme, ...(apiData.theme||{}) };
          data.brand = { ...DEFAULT.brand, ...(apiData.brand||{}) };
          data.hero = { ...DEFAULT.hero, ...(apiData.hero||{}) };
          data.mainWhatsapp = { ...DEFAULT.mainWhatsapp, ...(apiData.mainWhatsapp||{}) };
          data.units = apiData.units || DEFAULT.units;
        }
      }catch(e){}
      window.__data = data;

      el("brandName").value = (data.brand.name||"").toUpperCase();
      el("brandTagline").value = (data.brand.tagline||"").toUpperCase();
      el("brandLogoUrl").value = (data.brand.logoUrl||"");

      el("cBg").value = (data.theme.bg||"");
      el("cText").value = (data.theme.text||"");
      el("cRed").value = (data.theme.red||"");
      el("cTeal").value = (data.theme.teal||"");

      el("mainWaNumber").value = (data.mainWhatsapp.number||"");
      el("mainWaMsg").value = (data.mainWhatsapp.message||"").toUpperCase();
      el("mainWaLabel").value = (data.mainWhatsapp.label||"").toUpperCase();

      el("heroTitle").value = (data.hero.title||"").toUpperCase();
      el("heroText").value = (data.hero.text||"").toUpperCase();

      renderUnits(data.units || []);
      setStatus("PRONTO ✅", "ok");
    }

    async function save(){
      setStatus("SALVANDO…");
      const data = window.__data;

      data.brand = {
        name: el("brandName").value.trim(),
        tagline: el("brandTagline").value.trim(),
        logoUrl: el("brandLogoUrl").value.trim(),
      };
      data.theme = {
        bg: el("cBg").value.trim(),
        text: el("cText").value.trim(),
        red: el("cRed").value.trim(),
        teal: el("cTeal").value.trim(),
      };
      data.mainWhatsapp = {
        number: el("mainWaNumber").value.trim(),
        message: el("mainWaMsg").value.trim(),
        label: el("mainWaLabel").value.trim(),
      };
      data.hero = {
        title: el("heroTitle").value.trim(),
        text: el("heroText").value.trim(),
      };
      data.units = readUnitsFromDOM();

      const r = await fetch("/api/content", {
        method:"PUT",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(data)
      });

      if (r.ok) setStatus("SALVO ✅ ATUALIZE O SITE.", "ok");
      else setStatus("ERRO ❌ AO SALVAR. ABRA /api/content E VEJA SE A API RESPONDE.", "err");
    }

    el("addUnit").addEventListener("click", ()=>{
      window.__data.units.push({
        name:"NOVA UNIDADE",
        type:"UNIDADE",
        badge:"red",
        description:"",
        address:"",
        maps:"",
        whatsapp:"",
        wmsg:"OLÁ! QUERO INFORMAÇÕES."
      });
      renderUnits(window.__data.units);
    });

    el("save").addEventListener("click", save);
    el("reload").addEventListener("click", load);

    load();
  </script>
</body>
</html>
