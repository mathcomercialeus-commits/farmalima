<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LOGIN • FARMA LIMA</title>
  <style>
    :root{
      --PRIMARY:#00E5D8; --SECONDARY:#FF3B3B; --DARK:#0B0F14;
      --BORDER: rgba(255,255,255,.10); --WHITE:#fff; --MUTED:#9CA3AF;
      --RADIUS:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background: radial-gradient(1100px 700px at 15% 10%, rgba(0,229,216,.18), transparent 55%),
                  radial-gradient(1100px 700px at 85% 30%, rgba(255,59,59,.14), transparent 55%),
                  var(--DARK);
      color:var(--WHITE);
      text-transform:uppercase;
      letter-spacing:.6px;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .card{
      width:min(520px, 100%);
      border:1px solid var(--BORDER);
      border-radius:var(--RADIUS);
      background:rgba(18,24,33,.62);
      backdrop-filter: blur(10px);
      padding:18px;
    }
    h1{margin:0 0 6px; font-size:18px; letter-spacing:2px;}
    .sub{color:var(--MUTED); font-size:11px; letter-spacing:1px; margin-bottom:14px; text-transform:none;}
    label{display:block; font-size:11px; color:var(--MUTED); margin:10px 0 6px; letter-spacing:1px;}
    input{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.03);
      color:var(--WHITE);
      outline:none;
      font-weight:900;
      letter-spacing:1px;
      text-transform:uppercase;
    }
    .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
    .btn{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      color:var(--WHITE);
      padding:12px 14px;
      border-radius:999px;
      font-weight:1000;
      letter-spacing:1.2px;
      cursor:pointer;
      flex:1;
      min-width:140px;
    }
    .btn.primary{
      border:none;
      background:linear-gradient(180deg, rgba(0,229,216,1), rgba(0,180,170,1));
      color:#00110f;
    }
    .err{margin-top:10px; color:#ffb8b8; font-size:12px; text-transform:none;}
  </style>
</head>
<body>
  <div class="card">
    <h1>LOGIN • ADMIN</h1>
    <div class="sub">DIGITE A SENHA PARA ACESSAR O PAINEL.</div>

    <label>SENHA</label>
    <input id="pass" type="password" placeholder="SENHA" autocomplete="current-password"/>

    <div class="row">
      <button class="btn primary" id="btnLogin">ENTRAR</button>
      <a class="btn" href="/" style="text-align:center; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">VER SITE</a>
    </div>

    <div class="err" id="msg"></div>
  </div>

  <script>
    const msg = document.getElementById("msg");
    const pass = document.getElementById("pass");

    async function doLogin(){
      msg.textContent = "";
      const password = pass.value.trim();
      if(!password){
        msg.textContent = "INFORME A SENHA.";
        return;
      }

      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "content-type":"application/json" },
        body: JSON.stringify({ password })
      });

      if(r.ok){
        window.location.href = "/admin.html";
        return;
      }

      let t = "";
      try { t = (await r.json()).error || ""; } catch(e) {}
      msg.textContent = t || "SENHA INCORRETA.";
    }

    document.getElementById("btnLogin").addEventListener("click", doLogin);
    pass.addEventListener("keydown", (e)=>{ if(e.key==="Enter") doLogin(); });

    // se já estiver logado, manda direto pro admin
    (async ()=>{
      try{
        const r = await fetch("/api/me", { cache:"no-store" });
        if(r.ok){
          const j = await r.json();
          if(j.ok) window.location.href = "/admin.html";
        }
      }catch(e){}
    })();
  </script>
</body>
</html>
