<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>LOGIN • FARMA LIMA</title>
  <style>
    :root{
      --PRIMARY:#00E5D8;
      --SECONDARY:#FF3B3B;
      --DARK:#0B0F14;
      --BORDER: rgba(255,255,255,.10);
      --RADIUS:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background: radial-gradient(1100px 700px at 15% 10%, rgba(0,229,216,.18), transparent 55%),
                  radial-gradient(1100px 700px at 85% 30%, rgba(255,59,59,.14), transparent 55%),
                  var(--DARK);
      color:#fff;
      text-transform: uppercase;
      letter-spacing:.6px;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }
    .card{
      width:min(520px, 100%);
      border:1px solid var(--BORDER);
      border-radius:var(--RADIUS);
      background: rgba(18,24,33,.65);
      backdrop-filter: blur(10px);
      padding:18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    h1{margin:0 0 10px; font-size:18px; letter-spacing:2px}
    .muted{opacity:.75; font-size:12px; text-transform:none; letter-spacing:0; line-height:1.4}
    label{display:block; margin:12px 0 6px; font-size:11px; opacity:.7}
    input{
      width:100%;
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      color:#fff;
      font-weight:800;
      letter-spacing:1px;
      outline:none;
    }
    .row{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap}
    button, a{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      font-weight:1000;
      letter-spacing:1.2px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    button.primary{
      border:none;
      background: linear-gradient(180deg, rgba(0,229,216,1), rgba(0,180,170,1));
      color:#00110f;
    }
    .status{margin-top:10px; font-size:12px; text-transform:none; letter-spacing:0; opacity:.85}
  </style>
</head>
<body>
  <div class="card">
    <h1>LOGIN • ADMIN</h1>
    <div class="muted">DIGITE A SENHA PARA ACESSAR O PAINEL.</div>

    <label>SENHA</label>
    <input id="pass" type="password" placeholder="SUA SENHA" />

    <div class="row">
      <button class="primary" id="btnLogin">ENTRAR</button>
      <a href="/" target="_blank" rel="noopener">VER SITE</a>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script>
    const pass = document.getElementById("pass");
    const status = document.getElementById("status");

    function setStatus(msg, ok=true){
      status.textContent = msg;
      status.style.color = ok ? "#b8ffd8" : "#ffb8b8";
    }

    async function login(){
      const password = pass.value.trim();
      if(!password){
        setStatus("INFORME A SENHA.", false);
        return;
      }

      setStatus("ENTRANDO...");
      const r = await fetch("/api/login", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ password })
      });

      if(!r.ok){
        const t = await r.text();
        setStatus("ERRO: " + t, false);
        return;
      }

      window.location.href = "/admin.html";
    }

    document.getElementById("btnLogin").addEventListener("click", login);
    pass.addEventListener("keydown", (e)=>{ if(e.key==="Enter") login(); });
  </script>
</body>
</html>
