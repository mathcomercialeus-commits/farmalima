<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DASHBOARD0101 • FARMA LIMA</title>

  <style>
    :root{
      --PRIMARY:#00E5D8;
      --SECONDARY:#FF3B3B;
      --DARK:#0B0F14;
      --CARD:#121821;
      --MUTED:#9CA3AF;
      --WHITE:#FFFFFF;
      --RADIUS:18px;
      --BORDER: rgba(255,255,255,.10);
      --SHADOW: 0 16px 50px rgba(0,0,0,.45);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1100px 700px at 15% 10%, rgba(0,229,216,.18), transparent 55%),
                  radial-gradient(1100px 700px at 85% 30%, rgba(255,59,59,.14), transparent 55%),
                  var(--DARK);
      color: var(--WHITE);
      text-transform: uppercase;
      letter-spacing:.6px;
    }
    a{ color:inherit; text-decoration:none; }
    .wrap{ max-width: 1100px; margin: 0 auto; padding: 18px 14px 70px; }
    .top{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding: 14px 14px;
      border:1px solid var(--BORDER);
      background: rgba(18,24,33,.65);
      backdrop-filter: blur(10px);
      border-radius: var(--RADIUS);
      box-shadow: var(--SHADOW);
      position: sticky;
      top: 10px;
      z-index: 9;
    }
    .top strong{
      font-weight: 1000;
      letter-spacing: 1.8px;
      font-size: 13px;
    }
    .actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .btn{
      border:1px solid var(--BORDER);
      background: rgba(255,255,255,.04);
      color: var(--WHITE);
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 1000;
      letter-spacing: 1.2px;
      cursor:pointer;
      transition: .18s ease;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      user-select:none;
      min-height: 42px;
    }
    .btn:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,.20); }
    .btn.primary{ background: linear-gradient(180deg, rgba(0,229,216,1), rgba(0,180,170,1)); color:#00110f; border:none; }
    .btn.danger{ background: linear-gradient(180deg, rgba(255,59,59,1), rgba(200,30,30,1)); border:none; }
    .btn.ghost{ background: rgba(255,255,255,.03); }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }
    .card{
      border:1px solid var(--BORDER);
      background: rgba(18,24,33,.62);
      border-radius: var(--RADIUS);
      box-shadow: 0 14px 40px rgba(0,0,0,.35);
      padding: 16px;
    }
    .cardTitle{
      font-weight: 1000;
      letter-spacing: 1.6px;
      font-size: 13px;
      margin: 0 0 6px;
    }
    .muted{
      color: var(--MUTED);
      font-size: 11px;
      letter-spacing:1px;
      text-transform:none;
      line-height:1.35;
    }
    label{
      display:block;
      font-size: 11px;
      color: rgba(255,255,255,.70);
      margin: 10px 0 6px;
      letter-spacing:1.2px;
    }
    input, textarea, select{
      width:100%;
      padding: 12px 12px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      color: var(--WHITE);
      outline:none;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    textarea{ min-height: 92px; resize: vertical; text-transform:none; letter-spacing: .6px; font-weight:700; }
    .row{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .units{ display:flex; flex-direction:column; gap: 12px; margin-top: 12px; }
    .unitItem{
      border:1px dashed rgba(255,255,255,.18);
      background: rgba(255,255,255,.03);
      border-radius: 16px;
      padding: 12px;
    }
    .unitTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .unitTop strong{ font-weight: 1000; font-size: 12px; letter-spacing:1.4px; }
    .unitBtns{ display:flex; gap:10px; flex-wrap:wrap; }
    .unitBtns .btn{ padding: 9px 12px; min-height: 40px; }

    .status{
      margin-top: 12px;
      font-size: 12px;
      letter-spacing: .4px;
      text-transform:none;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      line-height:1.35;
      word-break: break-word;
    }
    .ok{ color:#b8ffd8; border-color: rgba(184,255,216,.25); }
    .bad{ color:#ffb8b8; border-color: rgba(255,184,184,.25); }

    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
      .row{ grid-template-columns: 1fr; }
      .top{ position: static; }
      .btn{ width: 100%; }
      .actions{ width: 100%; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <strong>DASHBOARD0101 • FARMA LIMA</strong>
      <div class="actions">
        <a class="btn ghost" href="/" target="_blank" rel="noopener">VER SITE</a>
        <button class="btn ghost" id="btnTest">TESTAR API</button>
        <button class="btn ghost" id="btnReload">RECARREGAR</button>
        <button class="btn primary" id="btnSave">SALVAR</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="cardTitle">MARCA</div>
        <div class="muted">EDITE OS TEXTOS E A LOGO. USE /ASSETS/LOGO-FARMALIMA.PNG</div>

        <label>NOME (TOPO)</label>
        <input id="brandName" placeholder="FARMA LIMA" />

        <label>SUBTÍTULO (TOPO)</label>
        <input id="brandSub" placeholder="ENDEREÇOS • CONTATOS • WHATSAPP" />

        <label>LOGO (URL / CAMINHO)</label>
        <input id="logoUrl" placeholder="/assets/logo-farmalima.png" />

        <label>TEXTO DO PILL</label>
        <input id="pillText" placeholder="DISK MEDICAÇÃO" />

        <label>WHATSAPP GLOBAL (55+DDD+NÚMERO)</label>
        <input id="globalWhatsapp" placeholder="5592..." />

        <label>TOKEN DE ADMIN</label>
        <input id="adminToken" type="password" autocomplete="current-password" placeholder="CONTENT_TOKEN" />

        <label>FOOTER</label>
        <input id="footerText" placeholder="© 2026 FARMA LIMA" />
      </div>

      <div class="card">
        <div class="cardTitle">HERO</div>
        <div class="muted">TEXTO PRINCIPAL DA PÁGINA</div>

        <label>TÍTULO</label>
        <input id="heroTitle" placeholder="BEM VINDO À FARMA LIMA" />

        <label>DESCRIÇÃO</label>
        <textarea id="heroDesc" placeholder="ATENDIMENTO RÁPIDO..."></textarea>

        <label>TÍTULO CARD</label>
        <input id="heroCardTitle" placeholder="ENTREGA RÁPIDA" />

        <label>SUBTÍTULO CARD</label>
        <input id="heroCardSub" placeholder="CHAME NO WHATSAPP..." />
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="unitTop">
        <div>
          <div class="cardTitle">UNIDADES</div>
          <div class="muted">ADICIONE / REMOVA. SE MAPS FICAR VAZIO, O SITE GERA AUTOMÁTICO PELO ENDEREÇO.</div>
        </div>
        <div class="unitBtns">
          <button class="btn primary" id="btnAddUnit">+ ADICIONAR</button>
        </div>
      </div>

      <div class="units" id="units"></div>

      <div id="status" class="status">PRONTO.</div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    $("adminToken").value = sessionStorage.getItem("farmalima_admin_token") || "";

    // ✅ DADOS PADRÃO (compatível com seu site moderno)
    const DEFAULT_DATA = {
      brandName: "FARMA LIMA",
      brandSub: "ENDEREÇOS • CONTATOS • WHATSAPP",
      logoUrl: "/assets/logo-farmalima.png",
      pillText: "DISK MEDICAÇÃO",
      heroTitle: "BEM VINDO À FARMA LIMA",
      heroDesc: "ATENDIMENTO RÁPIDO, PRESENÇA LOCAL E CONFIANÇA. CLIQUE NO WHATSAPP PARA FALAR AGORA OU VEJA AS UNIDADES ABAIXO.",
      heroCardTitle: "ENTREGA RÁPIDA",
      heroCardSub: "CHAME NO WHATSAPP E RECEBA COM AGILIDADE",
      globalWhatsapp: "5592999999999",
      footerText: "© 2026 FARMA LIMA",
      units: []
    };

    function setStatus(msg, ok=true){
      const s = $("status");
      s.classList.remove("ok","bad");
      s.classList.add(ok ? "ok" : "bad");
      s.textContent = msg;
    }

    function normalizeUpper(v){
      return (v ?? "").toString().trim().toUpperCase();
    }

    function escapeAttr(v){
      return (v ?? "").toString().replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function getAdminToken(){
      return ($("adminToken").value || "").trim();
    }

    function createUnitItem(u = {}){
      const wrap = document.createElement("div");
      wrap.className = "unitItem";

      wrap.innerHTML = `
        <div class="unitTop">
          <strong>UNIDADE</strong>
          <div class="unitBtns">
            <button class="btn danger u_remove" type="button">REMOVER</button>
          </div>
        </div>

        <div class="row">
          <div>
            <label>NOME</label>
            <input class="u_name" placeholder="CENTRO" value="${escapeAttr(normalizeUpper(u.name))}" />
          </div>
          <div>
            <label>OBS (OPCIONAL)</label>
            <input class="u_note" placeholder="ATENDIMENTO RÁPIDO" value="${escapeAttr(normalizeUpper(u.note))}" />
          </div>
        </div>

        <label>ENDEREÇO</label>
        <input class="u_address" placeholder="AV LEONARDO MALCHER, N 783" value="${escapeAttr(normalizeUpper(u.address))}" />

        <div class="row">
          <div>
            <label>WHATSAPP (55+DDD+NÚMERO)</label>
            <input class="u_whatsapp" placeholder="5592..." value="${escapeAttr(normalizeUpper(u.whatsapp))}" />
          </div>
          <div>
            <label>LINK MAPS (OPCIONAL)</label>
            <input class="u_maps" placeholder="https://maps..." value="${escapeAttr((u.maps ?? "").toString().trim())}" />
          </div>
        </div>
      `;

      wrap.querySelector(".u_remove").addEventListener("click", () => wrap.remove());
      return wrap;
    }

    function fillForm(data){
      const d = Object.assign({}, DEFAULT_DATA, data || {});
      $("brandName").value = normalizeUpper(d.brandName);
      $("brandSub").value = normalizeUpper(d.brandSub);
      $("logoUrl").value = (d.logoUrl ?? "").toString().trim();
      $("pillText").value = normalizeUpper(d.pillText);
      $("globalWhatsapp").value = normalizeUpper(d.globalWhatsapp);
      $("footerText").value = normalizeUpper(d.footerText);

      $("heroTitle").value = normalizeUpper(d.heroTitle);
      $("heroDesc").value = (d.heroDesc ?? "").toString(); // sem upper pra leitura
      $("heroCardTitle").value = normalizeUpper(d.heroCardTitle);
      $("heroCardSub").value = normalizeUpper(d.heroCardSub);

      $("units").innerHTML = "";
      const units = Array.isArray(d.units) ? d.units : [];
      if(units.length){
        units.forEach(u => $("units").appendChild(createUnitItem(u)));
      }else{
        $("units").appendChild(createUnitItem({
          name:"CENTRO",
          note:"ATENDIMENTO RÁPIDO",
          address:"AV LEONARDO MALCHER, N 783",
          whatsapp:d.globalWhatsapp,
          maps:""
        }));
      }
    }

    function collectData(){
      const items = Array.from($("units").querySelectorAll(".unitItem"));

      const units = items.map(el => ({
        name: normalizeUpper(el.querySelector(".u_name").value),
        note: normalizeUpper(el.querySelector(".u_note").value),
        address: normalizeUpper(el.querySelector(".u_address").value),
        whatsapp: (el.querySelector(".u_whatsapp").value || "").replace(/\D/g,""),
        maps: (el.querySelector(".u_maps").value || "").trim()
      })).filter(u => u.name || u.address);

      return {
        brandName: normalizeUpper($("brandName").value),
        brandSub: normalizeUpper($("brandSub").value),
        logoUrl: ($("logoUrl").value || "").trim(),
        pillText: normalizeUpper($("pillText").value),
        heroTitle: normalizeUpper($("heroTitle").value),
        heroDesc: ($("heroDesc").value || "").trim(),
        heroCardTitle: normalizeUpper($("heroCardTitle").value),
        heroCardSub: normalizeUpper($("heroCardSub").value),
        globalWhatsapp: ($("globalWhatsapp").value || "").replace(/\D/g,""),
        footerText: normalizeUpper($("footerText").value),
        units
      };
    }

    async function apiGet(){
      const r = await fetch("/api/content", { cache: "no-store" });
      const txt = await r.text();
      return { r, txt };
    }

    async function load(){
      setStatus("CARREGANDO...", true);
      try{
        const { r, txt } = await apiGet();
        if(!r.ok){
          setStatus(`ERRO AO CARREGAR • HTTP ${r.status}\n${txt}`, false);
          fillForm(DEFAULT_DATA);
          return;
        }
        let data = {};
        try{ data = JSON.parse(txt || "{}"); }catch(e){ data = {}; }
        fillForm(Object.keys(data).length ? data : DEFAULT_DATA);
        setStatus("OK • DADOS CARREGADOS", true);
      }catch(e){
        fillForm(DEFAULT_DATA);
        setStatus("NÃO CONSEGUI ACESSAR /API/CONTENT. VERIFIQUE SE A FUNCTION EXISTE.", false);
      }
    }

    async function testApi(){
      setStatus("TESTANDO API...", true);
      try{
        const { r, txt } = await apiGet();
        if(!r.ok){
          setStatus(`API FALHOU • HTTP ${r.status}\n${txt}`, false);
          return;
        }
        setStatus("API OK ✅ /API/CONTENT RESPONDEU", true);
      }catch(e){
        setStatus("API NÃO RESPONDE ❌ (OU TIMEOUT)", false);
      }
    }

    async function save(){
      setStatus("SALVANDO...", true);
      const body = collectData();
      const token = getAdminToken();

      if(!token){
        setStatus("INFORME O TOKEN DE ADMIN ANTES DE SALVAR.", false);
        return;
      }

      sessionStorage.setItem("farmalima_admin_token", token);

      try{
        const r = await fetch("/api/content", {
          method: "PUT", // ✅ alinhado com sua API
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });

        const txt = await r.text();

        if(!r.ok){
          setStatus(`ERRO AO SALVAR • HTTP ${r.status}\n${txt}`, false);
          return;
        }

        setStatus("SALVO ✅ ATUALIZE O SITE PARA VER.", true);
      }catch(e){
        setStatus("ERRO AO SALVAR ❌ (FALHA DE REDE OU /API/CONTENT INEXISTENTE)", false);
      }
    }

    // ✅ eventos
    $("btnAddUnit").addEventListener("click", () => {
      $("units").appendChild(createUnitItem({
        name:"NOVA UNIDADE",
        note:"",
        address:"",
        whatsapp:$("globalWhatsapp").value.replace(/\D/g,""),
        maps:""
      }));
      setStatus("UNIDADE ADICIONADA ✅", true);
    });

    $("btnReload").addEventListener("click", load);
    $("btnSave").addEventListener("click", save);
    $("btnTest").addEventListener("click", testApi);

    // init
    load();
  </script>
</body>
</html>
